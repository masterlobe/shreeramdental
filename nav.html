<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <header class="navbar-header">
  <!-- Added aspect-square to force a strict 1:1 container ratio -->
  <div class="circular-nav-wrapper relative w-full max-w-[500px] aspect-square mx-auto">
    
    <!-- SVG NAVIGATION RING & SECTORS -->
    <svg viewBox="0 0 500 500" class="w-full h-full">  
      <defs>
        <!-- Metallic Gold Gradient -->
        <linearGradient id="gold-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fef08a" />
          <stop offset="30%" stop-color="#d97706" />
          <stop offset="50%" stop-color="#fef9c3" />
          <stop offset="75%" stop-color="#b45309" />
          <stop offset="100%" stop-color="#78350f" />
        </linearGradient>

        <!-- Ivory Slice Radial Gradient -->
        <radialGradient id="ivory-gradient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="85%" stop-color="#f5efe6" />
          <stop offset="100%" stop-color="#e8decb" />
        </radialGradient>

        <!-- Deep Purple Central Background -->
        <radialGradient id="purple-center-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#581c87" />
          <stop offset="70%" stop-color="#3b0764" />
          <stop offset="100%" stop-color="#2e1065" />
        </radialGradient>

        <!-- Drop Shadows -->
        <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feComponentTransfer in="SourceAlpha">
            <feFuncA type="linear" slope="0.7"/>
          </feComponentTransfer>
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feOffset dx="0" dy="4"/>
          <feComposite operator="out" in2="SourceAlpha" result="inverse"/>
          <feFlood flood-color="#000" result="color"/>
          <feComposite operator="in" in2="inverse" result="shadow"/>
          <feComposite operator="over" in2="SourceGraphic"/>
        </filter>

        <!-- CURVED TEXT PATHS (Radius = 166px) -->
        <path id="path-home" d="M 167 106.24 A 166 166 0 0 1 333 106.24" />
        <path id="path-services" d="M 333 106.24 A 166 166 0 0 1 416 250" />
        <path id="path-contact" d="M 84 250 A 166 166 0 0 1 167 106.24" />

        <!-- Bottom Arcs -->
        <path id="path-about" d="M 333 393.76 A 166 166 0 0 0 416 250" />
        <path id="path-dentists" d="M 167 393.76 A 166 166 0 0 0 333 393.76" />
        <path id="path-testimonials" d="M 84 250 A 166 166 0 0 0 167 393.76" />
      </defs>

      <!-- Outer Solid Metallic Gold Border -->
      <circle cx="250" cy="250" r="212" fill="none" stroke="url(#gold-metallic)" stroke-width="7" />
      <circle cx="250" cy="250" r="208" fill="none" stroke="#3b1836" stroke-width="1" opacity="0.4" />

      <!-- Deep Purple Textured Inner Background Track -->
      <circle cx="250" cy="250" r="135" fill="url(#purple-center-grad)" filter="url(#inner-shadow)" />

      <!-- SECTOR 1: HOME -->
      <a href="#home" class="menu-item">
        <path class="sector" d="M 150 76.79 A 200 200 0 0 1 350 76.79 L 317.5 133.09 A 135 135 0 0 0 182.5 133.09 Z" />
        <text class="sector-text">
          <textPath href="#path-home" startOffset="50%" text-anchor="middle">Home</textPath>
        </text>
      </a>

      <!-- SECTOR 2: SERVICES -->
      <a href="#services" class="menu-item">
        <path class="sector" d="M 350 76.79 A 200 200 0 0 1 450 250 L 385 250 A 135 135 0 0 0 317.5 133.09 Z" />
        <text class="sector-text">
          <textPath href="#path-services" startOffset="50%" text-anchor="middle">Services</textPath>
        </text>
      </a>

      <!-- SECTOR 3: ABOUT -->
      <a href="#about" class="menu-item">
        <path class="sector" d="M 450 250 A 200 200 0 0 1 350 423.21 L 317.5 366.91 A 135 135 0 0 0 385 250 Z" />
        <text class="sector-text">
          <textPath href="#path-about" startOffset="50%" text-anchor="middle">About</textPath>
        </text>
      </a>

      <!-- SECTOR 4: OUR DENTISTS -->
      <a href="#doctors" class="menu-item">
        <path class="sector" d="M 340 423.21 A 200 200 0 0 1 160 423.21 L 189.25 366.91 A 135 135 0 0 0 310.75 366.91 Z" />
        <text class="sector-text">
          <textPath href="#path-dentists" startOffset="50%" text-anchor="middle">Our Dentists</textPath>
        </text>
      </a>

      <!-- SECTOR 5: TESTIMONIALS -->
      <a href="#testimonials" class="menu-item">
        <path class="sector" d="M 150 423.21 A 200 200 0 0 1 50 250 L 115 250 A 135 135 0 0 0 182.5 366.91 Z" />
        <text class="sector-text">
          <textPath href="#path-testimonials" startOffset="50%" text-anchor="middle">Testimonials</textPath>
        </text>
      </a>

      <!-- SECTOR 6: CONTACT -->
      <a href="#contact" class="menu-item">
        <path class="sector" d="M 50 250 A 200 200 0 0 1 150 76.79 L 182.5 133.09 A 135 135 0 0 0 115 250 Z" />
        <text class="sector-text">
          <textPath href="#path-contact" startOffset="50%" text-anchor="middle">Contact</textPath>
        </text>
      </a>

      <!-- Inner Gold Ring Border Separator -->
      <circle cx="250" cy="250" r="135" fill="none" stroke="url(#gold-metallic)" stroke-width="6" />
    </svg>

    <!-- HTML FLIP COIN OVERLAY (Strictly 54% width and aspect-square to guarantee matching height) -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
      <div class="coin-wrapper pointer-events-auto w-[54%] aspect-square">
        <div class="coin-flipper">
          
          <!-- FRONT SIDE: White with Logo -->
          <div class="coin-side coin-front p-2">
            <div class="w-full h-full rounded-full border-[3px] border-white p-2 flex items-center justify-center bg-white shadow-[inset_0_2px_8px_rgba(0,0,0,0.1)]">
              <img src="./images/logo.png" alt="Shree Ram Dental Hospital" class="w-full h-full object-contain" />
            </div>
          </div>

          <!-- BACK SIDE: Blue with "Click Around Me" -->
          <a href="#home" class="coin-side coin-back group p-1.5">
            <div class="w-full h-full rounded-full border-[2px] border-[#1e3a8a] p-2 flex flex-col items-center justify-center transition-colors group-hover:border-blue-500">
              <svg class="w-6 h-6 text-yellow-500 mb-1 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <span class="text-[10px] font-bold uppercase tracking-[0.1em] text-yellow-200/80 mb-0.5">click</span>
              <span class="text-xs font-black uppercase tracking-widest text-white leading-tight text-center">Around<br>Me</span>
            </div>
          </a>

        </div>
      </div>
    </div>

  </div>
</header>

<!-- THE CSS -->
<style>
  @keyframes coin-rhythm {
    0%, 45% { transform: rotateY(0deg); }
    55%, 85% { transform: rotateY(180deg); }
    95%, 100% { transform: rotateY(0deg); }
  }

  .coin-flipper {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    animation: coin-rhythm 5s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
  }

  .coin-wrapper:hover .coin-flipper {
    animation-play-state: paused;
  }

  .coin-side {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 5px solid #d97706; 
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
  }

  .coin-front {
    transform: rotateY(0deg);
    background-color: #ffffff;
  }

  .coin-back {
    transform: rotateY(180deg);
    background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%);
    color: #ffffff;
    cursor: pointer;
    text-decoration: none;
  }
</style>
</body>
</html>
